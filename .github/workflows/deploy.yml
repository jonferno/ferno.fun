name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Stage only the static site. The dev server and the Puppeteer test
      # harness stay in the repo but never reach the live site.
      - name: Stage site
        run: |
          mkdir -p _site/css _site/js _site/assets
          cp index.html music.html _site/
          cp css/style.css _site/css/
          cp js/fire.js js/main.js js/music.js js/tracks.js _site/js/
          cp assets/favicon.svg _site/assets/
          cp manifest.webmanifest robots.txt _headers _site/

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
