<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Music — FERNO.fun</title>
<meta name="description" content="Every Suno generation by Jonferno, with a play button for each track." />
<meta name="theme-color" content="#05070f" />
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="page-music">

<canvas id="fire" aria-hidden="true"></canvas>
<canvas id="embers" aria-hidden="true"></canvas>
<div class="fx scanlines" aria-hidden="true"></div>
<div class="fx vignette" aria-hidden="true"></div>
<div class="fx grain" aria-hidden="true"></div>
<div class="fx bluewash" aria-hidden="true"></div>

<main class="screen screen--music is-active">
  <header class="hub__bar">
    <a class="btn btn--ghost" href="index.html">
      <span class="btn__glyph" aria-hidden="true">◀</span>
      <span class="btn__label">BACK</span>
    </a>
    <h2 class="hub__title">MUSIC&nbsp;GENERATION</h2>
    <div class="hub__status"><i class="pip pip--live"></i><span id="track-count">10 TRACKS</span></div>
  </header>

  <div class="player" id="player">
    <div class="player__now" id="now-playing">
      <div class="player__cover" id="np-cover"></div>
      <div class="player__meta">
        <div class="player__title" id="np-title">NOTHING PLAYING</div>
        <div class="player__sub" id="np-sub">pick a track</div>
      </div>
      <div class="player__time" id="np-time">0:00</div>
    </div>
    <div class="player__bar">
      <div class="player__progress" id="np-progress"></div>
    </div>
  </div>

  <div class="tracks" id="tracks"></div>

  <footer class="hub__foot">
    <div class="ticker" aria-hidden="true"><span id="ticker"></span></div>
    <div class="hub__legal">tracks generated with Suno · <a href="https://suno.com/@jonferno" target="_blank" rel="noopener noreferrer">suno.com/@jonferno</a></div>
  </footer>
</main>

<!-- no crossorigin: the Suno CDN does not send CORS headers, and the
     attribute makes the browser abort the media request -->
<audio id="audio" preload="none"></audio>

<script src="js/tracks.js"></script>
<script src="js/fire.js" defer></script>
<script src="js/music.js" defer></script>
</body>
</html>
